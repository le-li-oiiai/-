<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏大厅</title>
    <!-- 引入分离的 CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==========================================
         界面 1: 主菜单
         ========================================== -->
    <div id="screen-menu" class="screen active">
        <div class="menu-buttons">
            <button class="menu-btn" onclick="switchGame('minesweeper')">💣 经典扫雷</button>
            <button class="menu-btn" onclick="switchGame('orbit')">🪐 星轨穿梭</button>
        </div>
    </div>

    <!-- ==========================================
         界面 2: 扫雷
         ========================================== -->
    <div id="screen-minesweeper" class="screen">
        <button class="back-btn" onclick="switchGame('menu')">← 返回大厅</button>
        <div class="game-panel">
            <div class="rules">💡 规则：左键排雷，右键插旗。手机端请使用下方切换按钮。</div>
            <div class="mobile-controls">
                <button id="btn-reveal" class="active">⛏️ 排雷</button>
                <button id="btn-flag">🚩 插旗</button>
            </div>
            <div class="controls">
                <select id="difficulty">
                    <option value="easy">初级 (9x9, 10雷)</option>
                    <option value="medium">中级 (16x16, 40雷)</option>
                    <option value="hard">高级 (16x30, 99雷)</option>
                </select>
                <button id="restart-btn">重新开始</button>
            </div>
            <div class="stats-bar">
                <div class="stat-item">🚩 当前插旗: <span id="stat-flags" class="stat-value">0</span></div>
                <div class="stat-item">🔍 未翻开格: <span id="stat-safe" class="stat-value safe">0</span></div>
            </div>
            <div class="status-bar">
                <span id="status-text">点击格子开始游戏</span>
                <span>⏱️ <span id="time-display">0</span>s</span>
            </div>
            <div class="board-wrapper"><div id="game-board"></div></div>
        </div>
        <div class="history-panel">
            <h3>📜 本次打开记录</h3>
            <ul id="history-list"><li style="color:#999; justify-content:center;">暂无记录，开始你的第一局吧</li></ul>
        </div>
    </div>

    <!-- ==========================================
         界面 3: 星轨穿梭
         ========================================== -->
    <div id="screen-orbit" class="screen">
        <div class="orbit-container">
            
            <div class="welcome-overlay active" id="orbit-welcome">
                <h2>🪐 星轨穿梭</h2>
                <p>利用离心力在圆轨间跳跃</p>
                <div class="diff-select">
                    <label class="diff-option" id="diff-easy-label">
                        <input type="radio" name="orbit-diff" value="easy"> 简单
                    </label>
                    <label class="diff-option selected" id="diff-normal-label">
                        <input type="radio" name="orbit-diff" value="normal" checked> 正常
                    </label>
                    <label class="diff-option" id="diff-endless-label">
                        <input type="radio" name="orbit-diff" value="endless"> 无尽
                    </label>
                </div>
                <button class="start-btn" onclick="startOrbitWithDifficulty()">开始游戏</button>
            </div>

            <canvas id="orbit-canvas"></canvas>
            
            <div class="orbit-sidebar">
                <h3>📜 穿梭记录</h3>
                <ul class="orbit-hist-list" id="orbit-hist-list">
                    <li style="color:#999; justify-content:center; border:none;">暂无记录</li>
                </ul>
            </div>

            <div class="orbit-ui">
                <div class="orbit-score-box">得分: <span id="orbit-score">0</span></div>
            </div>
            
            <button class="orbit-back-btn" onclick="switchGame('menu')">返回大厅</button>
            <div class="jump-hint" id="jump-hint">按 空格 或 点击屏幕 脱离轨道！</div>

            <div class="modal-overlay" id="fail-modal">
                <div class="modal-box">
                    <h2>😵 掉落深渊！</h2>
                    <p>是否消耗一次机会，直接传送到下一个圈？</p>
                    <button class="modal-btn btn-primary" onclick="respawnOrbit()">复活</button>
                    <button class="modal-btn btn-secondary" onclick="restartOrbitFromFail()">重来</button>
                </div>
            </div>

            <div class="modal-overlay" id="win-modal">
                <div class="modal-box">
                    <h2 style="color: #27ae60;">🎉 挑战成功！</h2>
                    <p>你成功到达了终点，获得了 <b id="final-score">0</b> 分！</p>
                    <button class="modal-btn btn-secondary" onclick="switchGame('menu')">回到大厅</button>
                    <button class="modal-btn btn-primary" onclick="restartOrbitFromWin()">重来一次</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 按顺序引入 JS 文件 -->
    <script src="js/minesweeper.js"></script>
    <script src="js/orbit.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
