<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人网页</title>
    <style>
        /* 这里是网页的样式（CSS），负责让它变好看 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            max-width: 800px;
            width: 100%;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .content-box {
            background-color: #e8f4f8;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        ul {
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 这里开始是你网页上能看到的内容 -->
        <h1>欢迎来到我的网页！</h1>
        
        <p>你好，这是我用 GitHub Pages 部署的第一个网页。目前我正在学习如何编写 HTML 和 CSS。</p>

        <div class="content-box">
            <h2>📁 文件夹里的内容：</h2>
            <!-- 这里可以修改成你文件夹里实际有的东西 -->
            <ul>
                <li>文件一：我的学习笔记.txt</li>
                <li>文件二：我的照片.jpg</li>
                <li>文件三：一些有趣的代码</li>
            </ul>
        </div>

        <p style="text-align: center; margin-top: 40px; color: #7f8c8d; font-size: 14px;">
            由 [你的名字] 制作 © 2026
        </p>
    </div>

</body>
</html>
