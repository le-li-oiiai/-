<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的游戏大厅</title>
    <style>
        /* ====== 全局及大厅样式 ====== */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 { color: #e94560; margin-bottom: 20px; text-shadow: 0 0 10px rgba(233, 69, 96, 0.5); }

        .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
        .screen.active { display: flex; }

        /* ====== 主菜单 ====== */
        .menu-buttons { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 50px; }
        .menu-btn {
            background-color: #0f3460;
            border: 2px solid #e94560;
            color: white;
            padding: 20px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.2);
        }
        .menu-btn:hover { background-color: #e94560; transform: translateY(-5px); }
        .back-btn { background: none; border: 1px solid #7f8c8d; color: #7f8c8d; padding: 5px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        .back-btn:hover { color: white; border-color: white; }

        /* ====== 扫雷原有样式 (微调背景) ====== */
        .game-panel { background-color: #16213e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; max-width: 100%; overflow: hidden; }
        .rules { font-size: 14px; color: #a0a0a0; margin-bottom: 15px; background: #0f3460; padding: 8px; border-radius: 5px; display: inline-block; }
        .controls, .mobile-controls { margin-bottom: 15px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        select, button { padding: 8px 12px; font-size: 14px; border-radius: 5px; border: none; cursor: pointer; background-color: #0f3460; color: white; transition: all 0.2s; }
        button:hover { background-color: #e94560; }
        .mobile-controls button { background-color: #2a2a4a; border: 2px solid transparent; flex: 1; max-width: 120px; }
        .mobile-controls button.active { background-color: #e94560; border-color: #ff7b9c; }
        .stats-bar { display: flex; justify-content: space-around; background-color: #0f3460; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; font-size: 15px; }
        .stat-value { color: #e94560; font-size: 18px; }
        .status-bar { display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #3498db; padding: 0 10px; }
        .board-wrapper { overflow-x: auto; padding-bottom: 5px; }
        #game-board { display: grid; gap: 2px; background-color: #0a0a15; padding: 5px; border-radius: 5px; margin: 0 auto; user-select: none; width: fit-content; }
        .cell { width: 30px; height: 30px; background-color: #1e3b70; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; cursor: pointer; border-radius: 3px; box-shadow: inset 2px 2px 5px rgba(255,255,255,0.1), inset -2px -2px 5px rgba(0,0,0,0.3); }
        .cell:hover { background-color: #2a4a8a; }
        .cell.revealed { background-color: #16213e; box-shadow: none; cursor: default; }
        .cell.mine { background-color: #e94560; color: white; }
        .cell.flag { color: #f1c40f; font-size: 20px; }
        .cell[data-num="1"] { color: #3498db; } .cell[data-num="2"] { color: #2ecc71; } .cell[data-num="3"] { color: #e74c3c; } .cell[data-num="4"] { color: #9b59b6; } .cell[data-num="5"] { color: #e67e22; } .cell[data-num="6"] { color: #1abc9c; } .cell[data-num="7"] { color: #ecf0f1; } .cell[data-num="8"] { color: #95a5a6; }
        .cell.egg-animate { background-color: #f1c40f; box-shadow: 0 0 10px #f1c40f; transform: scale(1.1); transition: all 0.3s ease; }
        .history-panel { background-color: #16213e; padding: 15px 20px; border-radius: 10px; margin-top: 20px; width: 100%; max-width: 400px; }
        #history-list { list-style: none; padding: 0; margin: 0; font-size: 14px; }
        #history-list li { padding: 8px; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; }

        /* ====== 星轨穿梭 (Orbit) 样式 ====== */
        .orbit-container { position: relative; width: 100%; max-width: 1000px; background-color: #0a0a15; border-radius: 10px; overflow: hidden; box-shadow: 0 0 20px rgba(52, 152, 219, 0.2); display: flex; flex-direction: column; align-items: center; }
        canvas { display: block; width: 100%; height: 600px; cursor: crosshair; }
        .orbit-ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; pointer-events: none; }
        .orbit-score { color: #fff; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        .jump-hint { color: #e94560; font-size: 24px; font-weight: bold; text-shadow: 0 0 10px #e94560; animation: pulse 1.5s infinite; opacity: 0; transition: opacity 0.3s; }
        .jump-hint.show { opacity: 1; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .mobile-jump-btn { display: none; position: absolute; bottom: 20px; right: 20px; width: 80px; height: 80px; border-radius: 50%; background-color: rgba(233, 69, 96, 0.8); color: white; font-size: 16px; border: none; box-shadow: 0 0 20px rgba(233, 69, 96, 0.5); pointer-events: auto; user-select: none; }
        @media (max-width: 600px) {
            .cell { width: 24px; height: 24px; font-size: 14px; }
            .cell.flag { font-size: 16px; }
            .stats-bar { font-size: 13px; flex-direction: column; gap: 5px; }
            .mobile-jump-btn { display: block; }
            canvas { height: 500px; }
        }
    </style>
</head>
<body>

    <h1 id="page-title">🎮 游戏大厅</h1>

    <!-- 1. 主菜单 -->
    <div id="screen-menu" class="screen active">
        <div class="menu-buttons">
            <button class="menu-btn" onclick="switchGame('minesweeper')">💣 经典扫雷</button>
            <button class="menu-btn" onclick="switchGame('orbit')">🪐 星轨穿梭</button>
        </div>
    </div>

    <!-- 2. 扫雷游戏 -->
    <div id="screen-minesweeper" class="screen">
        <button class="back-btn" onclick="switchGame('menu')">← 返回大厅</button>
        <div class="game-panel">
            <div class="rules">💡 规则：左键排雷，右键插旗。手机端请使用下方切换按钮。</div>
            <div class="mobile-controls">
                <button id="btn-reveal" class="active">⛏️ 排雷</button>
                <button id="btn-flag">🚩 插旗</button>
            </div>
            <div class="controls">
                <select id="difficulty">
                    <option value="easy">初级 (9x9, 10雷)</option>
                    <option value="medium">中级 (16x16, 40雷)</option>
                    <option value="hard">高级 (16x30, 99雷)</option>
                </select>
                <button id="restart-btn">重新开始</button>
            </div>
            <div class="stats-bar">
                <div class="stat-item">🚩 当前插旗: <span id="stat-flags" class="stat-value">0</span></div>
                <div class="stat-item">🔍 未翻开格: <span id="stat-safe" class="stat-value safe">0</span></div>
            </div>
            <div class="status-bar">
                <span id="status-text">点击格子开始游戏</span>
                <span>⏱️ <span id="time-display">0</span>s</span>
            </div>
            <div class="board-wrapper"><div id="game-board"></div></div>
        </div>
        <div class="history-panel">
            <h3>📜 本次打开记录</h3>
            <ul id="history-list"><li style="color:#999; justify-content:center;">暂无记录，开始你的第一局吧</li></ul>
        </div>
    </div>

    <!-- 3. 星轨穿梭游戏 -->
    <div id="screen-orbit" class="screen">
        <button class="back-btn" onclick="switchGame('menu')">← 返回大厅</button>
        <div class="orbit-container">
            <canvas id="orbit-canvas"></canvas>
            <div class="orbit-ui">
                <div class="orbit-score">进度: <span id="orbit-progress">0 / 0</span></div>
                <div class="jump-hint" id="jump-hint">按 空格 键脱离轨道！</div>
            </div>
            <button class="mobile-jump-btn" id="mobile-jump">跳跃</button>
        </div>
        <div style="margin-top: 15px; color: #7f8c8d; text-align: center; max-width: 600px;">
            🚀 <b>玩法：</b>小球被无形丝线拴在圆圈上旋转（红顺蓝逆）。按下<b>空格键</b>（或点击跳跃按钮）切断丝线，小球会沿切线飞出。受重力影响，在合适的时机飞出，碰到其他圈会自动吸附并调整速度。到达最后一个绿圈即可获胜！
        </div>
    </div>

    <script>
        // ==========================================
        // 页面切换逻辑
        // ==========================================
        let currentGame = 'menu';

        function switchGame(gameName) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            currentGame = gameName;

            if (gameName === 'menu') {
                document.getElementById('page-title').innerText = '🎮 游戏大厅';
                document.getElementById('screen-menu').classList.add('active');
                stopOrbitGame();
            } else if (gameName === 'minesweeper') {
                document.getElementById('page-title').innerText = '💣 经典扫雷';
                document.getElementById('screen-minesweeper').classList.add('active');
                initGame(); // 初始化扫雷
            } else if (gameName === 'orbit') {
                document.getElementById('page-title').innerText = '🪐 星轨穿梭';
                document.getElementById('screen-orbit').classList.add('active');
                initOrbitGame(); // 初始化星轨
            }
        }

        // ==========================================
        // 💣 扫雷游戏逻辑 (之前的部分)
        // ==========================================
        let rows = 9, cols = 9, mineCount = 10;
        let board = [], cellElements = [];
        let isGameOver = false, isFirstClick = true, revealedCount = 0, flagsPlaced = 0;
        let timerInterval = null, timeElapsed = 0;
        let currentMode = 'reveal';
        let gameHistory = [];

        const boardEl = document.getElementById('game-board');
        const difficultySelect = document.getElementById('difficulty');
        const restartBtn = document.getElementById('restart-btn');
        const statusText = document.getElementById('status-text');
        const timeDisplay = document.getElementById('time-display');
        const historyList = document.getElementById('history-list');
        const btnReveal = document.getElementById('btn-reveal');
        const btnFlag = document.getElementById('btn-flag');
        const statFlags = document.getElementById('stat-flags');
        const statSafe = document.getElementById('stat-safe');

        function initGame() {
            isGameOver = false; isFirstClick = true; revealedCount = 0; flagsPlaced = 0;
            stopTimer(); timeElapsed = 0; timeDisplay.textContent = 0;
            statusText.textContent = '点击格子开始游戏'; statusText.style.color = '#3498db';

            const diff = difficultySelect.value;
            if (diff === 'easy') { rows = 9; cols = 9; mineCount = 10; }
            else if (diff === 'medium') { rows = 16; cols = 16; mineCount = 40; }
            else if (diff === 'hard') { rows = 16; cols = 30; mineCount = 99; }

            boardEl.style.gridTemplateColumns = `repeat(${cols}, ${window.innerWidth < 600 ? '24px' : '30px'})`;
            boardEl.innerHTML = '';
            board = Array(rows).fill().map(() => Array(cols).fill(0));
            cellElements = Array(rows).fill().map(() => Array(cols).fill(null));

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.addEventListener('click', () => { if (currentMode === 'reveal') handleReveal(r, c); else handleFlag(r, c); });
                    cell.addEventListener('contextmenu', (e) => { e.preventDefault(); handleFlag(r, c); });
                    boardEl.appendChild(cell);
                    cellElements[r][c] = cell;
                }
            }
            updateStats();
        }

        function startTimer() {
            stopTimer(); timeElapsed = 0; timeDisplay.textContent = timeElapsed;
            timerInterval = setInterval(() => { timeElapsed++; timeDisplay.textContent = timeElapsed; }, 1000);
        }
        function stopTimer() { if (timerInterval) clearInterval(timerInterval); }

        function updateStats() {
            statFlags.textContent = flagsPlaced;
            statSafe.textContent = (rows * cols) - revealedCount;
        }

        function placeMines(firstR, firstC) {
            let minesPlaced = 0;
            while (minesPlaced < mineCount) {
                let r = Math.floor(Math.random() * rows), c = Math.floor(Math.random() * cols);
                if (board[r][c] === -1 || (r === firstR && c === firstC)) continue;
                board[r][c] = -1; minesPlaced++;
            }
            calculateNumbers();
        }

        function calculateNumbers() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c] === -1) continue;
                    let count = 0;
                    for (let i = -1; i <= 1; i++) {
                        for (let j = -1; j <= 1; j++) {
                            let nr = r + i, nc = c + j;
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc] === -1) count++;
                        }
                    }
                    board[r][c] = count;
                }
            }
        }

        function handleReveal(r, c) {
            if (isGameOver) return;
            const cell = cellElements[r][c];
            if (cell.classList.contains('revealed') || cell.classList.contains('flag')) return;

            if (isFirstClick) { placeMines(r, c); isFirstClick = false; startTimer(); statusText.textContent = '游戏进行中...'; }
            if (board[r][c] === -1) gameOver(false);
            else { revealCell(r, c); checkWin(); }
            updateStats();
        }

        function handleFlag(r, c) {
            if (isGameOver || isFirstClick) return;
            const cell = cellElements[r][c];
            if (cell.classList.contains('revealed')) return;
            if (cell.classList.contains('flag')) { cell.classList.remove('flag'); cell.textContent = ''; flagsPlaced--; }
            else { cell.classList.add('flag'); cell.textContent = '🚩'; flagsPlaced++; }
            updateStats();
        }

        function revealCell(r, c) {
            if (r < 0 || r >= rows || c < 0 || c >= cols) return;
            const cell = cellElements[r][c];
            if (cell.classList.contains('revealed') || cell.classList.contains('flag')) return;
            cell.classList.add('revealed'); revealedCount++;
            if (board[r][c] > 0) { cell.textContent = board[r][c]; cell.dataset.num = board[r][c]; }
            else { for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) revealCell(r + i, c + j); }
        }

        function checkWin() { if (revealedCount === rows * cols - mineCount) gameOver(true); }

        function gameOver(isWin) {
            isGameOver = true; stopTimer();
            let diffName = difficultySelect.options[difficultySelect.selectedIndex].text.split(' ')[0];
            if (isWin) {
                statusText.textContent = '🎉 恭喜你，排雷成功！'; statusText.style.color = '#27ae60';
                addHistory(`✅ ${diffName}胜利`, timeElapsed);
                if (difficultySelect.value === 'hard') triggerHiEgg();
            } else {
                for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
                    if (board[r][c] === -1) {
                        const cell = cellElements[r][c];
                        if (!cell.classList.contains('flag')) { cell.textContent = '💣'; cell.classList.add('mine'); }
                    }
                }
                statusText.textContent = '💥 轰！你踩到雷了...'; statusText.style.color = '#e74c3c';
                addHistory(`💀 ${diffName}失败`, timeElapsed);
            }
        }

        function triggerHiEgg() {
            setTimeout(() => {
                statusText.textContent = '✨ 发现隐藏彩蛋！'; statusText.style.color = '#d35400';
                for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
                    cellElements[r][c].className = 'cell'; cellElements[r][c].textContent = '';
                }
                const pattern = ["..............................","..............................","..............................","....##........#...............","....##........#...............","....##........#...............","....##........#...............","....##############............","....##############............","....##........#...............","....##........#...............","....##........#...............","....##........#...............","....##........#...............","..............................",".............................."];
                let delay = 0;
                for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
                    if (pattern[r] && pattern[r][c] === '#') {
                        setTimeout(() => { let cell = cellElements[r][c]; cell.textContent = '💣'; cell.classList.add('egg-animate'); }, delay);
                        delay += 15;
                    }
                }
            }, 600);
        }

        function addHistory(resultStr, time) {
            gameHistory.unshift({ resultStr, time });
            if (gameHistory.length > 5) gameHistory.pop();
            historyList.innerHTML = '';
            if (gameHistory.length === 0) { historyList.innerHTML = '<li style="color:#999; justify-content:center;">暂无记录</li>'; return; }
            gameHistory.forEach(record => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${record.resultStr}</span> <span>⏱️ ${record.time} 秒</span>`;
                historyList.appendChild(li);
            });
        }

        btnReveal.addEventListener('click', () => { currentMode = 'reveal'; btnReveal.classList.add('active'); btnFlag.classList.remove('active'); });
        btnFlag.addEventListener('click', () => { currentMode = 'flag'; btnFlag.classList.add('active'); btnReveal.classList.remove('active'); });
        restartBtn.addEventListener('click', initGame);
        difficultySelect.addEventListener('change', initGame);


        // ==========================================
        // 🪐 星轨穿梭 (Orbit) 游戏逻辑
        // ==========================================
        const canvas = document.getElementById('orbit-canvas');
        const ctx = canvas.getContext('2d');
        const progressText = document.getElementById('orbit-progress');
        const jumpHint = document.getElementById('jump-hint');
        const mobileJumpBtn = document.getElementById('mobile-jump');

        let orbitAnimId;
        let circles = [];
        let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 8, attachedIdx: -1, angle: 0, isAttached: true };
        let orbitGravity = 800; // 重力加速度 (px/s^2)
        let orbitState = 'playing'; // playing, won, lost
        let lastTime = 0;
        let orbitSpeedMultiplier = 1; // 用于调试

        // 窗口自适应
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height || 600;
        }
        window.addEventListener('resize', resizeCanvas);

        // 初始化关卡
        function initOrbitGame() {
            cancelAnimationFrame(orbitAnimId);
            resizeCanvas();
            orbitState = 'playing';
            circles = [];
            
            // 构造一条波浪形向下的路径
            let startX = 100;
            let startY = 100;
            let numCircles = 6; // 圈的数量
            let minR = 40, maxR = 80;

            for (let i = 0; i < numCircles; i++) {
                let r = Math.random() * (maxR - minR) + minR;
                let x, y;
                
                if (i === 0) {
                    x = startX; y = startY;
                } else if (i === numCircles - 1) {
                    // 最后一个圈（终点）放在右下
                    x = canvas.width - 150;
                    y = canvas.height - 150;
                } else {
                    // 中间圈随机偏移
                    let prev = circles[i-1];
                    x = prev.x + Math.random() * 200 + 100;
                    // 保持在画面内并向下延伸
                    y = prev.y + (Math.random() * 200 - 50);
                    y = Math.max(100, Math.min(canvas.height - 100, y));
                    // 如果 x 超出屏幕，回到左边
                    if (x > canvas.width - 150) x = canvas.width - 150;
                }

                // 颜色：起点红色，终点绿色，中间红蓝交替
                let color = (i % 2 === 0) ? 'red' : 'blue';
                if (i === 0) color = 'start';
                if (i === numCircles - 1) color = 'end';

                circles.push({ x, y, r, color });
            }

            // 初始化小球在第一个圈上
            let c0 = circles[0];
            ball.attachedIdx = 0;
            ball.isAttached = true;
            ball.angle = -Math.PI / 2; // 从正上方开始
            ball.x = c0.x + c0.r * Math.cos(ball.angle);
            ball.y = c0.y + c0.r * Math.sin(ball.angle);
            
            updateOrbitUI();
            lastTime = performance.now();
            orbitAnimId = requestAnimationFrame(orbitLoop);
        }

        function stopOrbitGame() {
            cancelAnimationFrame(orbitAnimId);
        }

        function updateOrbitUI() {
            progressText.textContent = `${ball.attachedIdx + 1} / ${circles.length}`;
            if (ball.isAttached && orbitState === 'playing') {
                jumpHint.classList.add('show');
            } else {
                jumpHint.classList.remove('show');
            }
        }

        // 核心跳跃动作
        function jump() {
            if (!ball.isAttached || orbitState !== 'playing') return;

            let c = circles[ball.attachedIdx];
            
            // 沿切线方向飞出
            let speed = Math.sqrt(orbitGravity * c.r); // 维持圆周运动的最小速度
            let tangentAngle = ball.angle + (c.color === 'blue' ? -Math.PI / 2 : Math.PI / 2); // 蓝逆时针，红顺时针
            
            ball.vx = speed * Math.cos(tangentAngle);
            ball.vy = speed * Math.sin(tangentAngle);
            ball.isAttached = false;
            
            updateOrbitUI();
        }

        // 碰撞检测：判断线段(上一帧位置到当前帧位置)与圆是否相交
        function checkCollision(x0, y0, x1, y1) {
            for (let i = 0; i < circles.length; i++) {
                if (i === ball.attachedIdx) continue; // 忽略当前圈
                let c = circles[i];
                
                // 简单的距离检测，如果在圆环附近（半径误差范围内）
                let dx = x1 - c.x;
                let dy = y1 - c.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                
                // 如果球心距离圆心近似等于半径（考虑到时间步长，容差取大一点）
                if (Math.abs(dist - c.r) < ball.radius + 15) {
                    return i; // 发生碰撞，返回圈的索引
                }
            }
            return -1;
        }

        // 主循环
        function orbitLoop(timestamp) {
            if (orbitState !== 'playing') return;
            
            let dt = (timestamp - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1; // 防止切后台后瞬移过大
            lastTime = timestamp;

            // 1. 更新物理
            if (ball.isAttached) {
                let c = circles[ball.attachedIdx];
                let speed = Math.sqrt(orbitGravity * c.r); // 恒定线速度
                let angularSpeed = speed / c.r; // 角速度

                // 蓝逆时针，红顺时针
                if (c.color === 'blue') {
                    ball.angle -= angularSpeed * dt;
                } else {
                    ball.angle += angularSpeed * dt;
                }

                ball.x = c.x + c.r * Math.cos(ball.angle);
                ball.y = c.y + c.r * Math.sin(ball.angle);
            } else {
                // 飞行状态
                let prevX = ball.x;
                let prevY = ball.y;

                ball.vy += orbitGravity * dt;
                ball.x += ball.vx * dt;
                ball.y += ball.vy * dt;

                // 碰撞检测
                let hitIdx = checkCollision(prevX, prevY, ball.x, ball.y);
                if (hitIdx !== -1) {
                    // 吸附到新圈
                    ball.attachedIdx = hitIdx;
                    ball.isAttached = true;
                    let newC = circles[hitIdx];
                    
                    // 重新计算吸附后的角度
                    ball.angle = Math.atan2(ball.y - newC.y, ball.x - newC.x);
                    
                    // 胜利条件
                    if (newC.color === 'end') {
                        orbitState = 'won';
                        jumpHint.innerText = "🎉 到达终点！恭喜通关！";
                        jumpHint.style.color = "#2ecc71";
                        jumpHint.classList.add('show');
                        updateOrbitUI();
                        return;
                    } else {
                        updateOrbitUI();
                    }
                }
            }

            // 2. 边界判定（掉出屏幕）
            if (ball.y > canvas.height + 50 || ball.x < -50 || ball.x > canvas.width + 50) {
                orbitState = 'lost';
                jumpHint.innerText = "💀 坠落深渊，按返回大厅重试";
                jumpHint.style.color = "#e74c3c";
                jumpHint.classList.add('show');
                return;
            }

            // 3. 绘制画面
            drawOrbit();

            // 4. 循环下一帧
            if (orbitState === 'playing') {
                orbitAnimId = requestAnimationFrame(orbitLoop);
            }
        }

        function drawOrbit() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 绘制背景星星 (可选，增加氛围)
            ctx.fillStyle = "#ffffff";
            for(let i=0; i<50; i++) {
                let x = (i * 137.5) % canvas.width;
                let y = (i * 314.1) % canvas.height;
                ctx.globalAlpha = 0.1 + (i % 5) * 0.1;
                ctx.beginPath(); ctx.arc(x, y, 1, 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;

            // 绘制圆圈
            for (let i = 0; i < circles.length; i++) {
                let c = circles[i];
                
                // 颜色设定
                if (c.color === 'red') ctx.strokeStyle = '#e94560'; // 红色
                else if (c.color === 'blue') ctx.strokeStyle = '#3498db'; // 蓝色
                else if (c.color === 'start') ctx.strokeStyle = '#f1c40f'; // 起点黄色
                else ctx.strokeStyle = '#2ecc71'; // 终点绿色

                // 如果是当前所在圈，高亮
                if (ball.attachedIdx === i && ball.isAttached) {
                    ctx.lineWidth = 4;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = ctx.strokeStyle;
                } else {
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 0;
                }

                ctx.beginPath();
                ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
                ctx.stroke();

                // 绘制指引箭头(方向)
                ctx.fillStyle = ctx.strokeStyle;
                let arrowAngle = (c.color === 'blue') ? Math.PI : 0;
                let ax = c.x + c.r * Math.cos(arrowAngle);
                let ay = c.y + c.r * Math.sin(arrowAngle);
                ctx.beginPath();
                ctx.arc(ax, ay, 4, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.shadowBlur = 0;

            // 绘制小球
            ctx.fillStyle = '#ffffff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // 键盘事件监听 (全局)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // 阻止页面滚动
                if (currentGame === 'orbit') {
                    jump();
                }
            }
        });

        // 手机端跳跃按钮
        mobileJumpBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            jump();
        });
        mobileJumpBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            jump();
        });
        
        // 点击Canvas也能跳跃
        canvas.addEventListener('mousedown', () => {
            if (currentGame === 'orbit') jump();
        });
        
        canvas.addEventListener('touchstart', (e) => {
            if (currentGame === 'orbit') { e.preventDefault(); jump(); }
        });

        // 确保页面加载完
        window.onload = () => {
            resizeCanvas();
        };

    </script>
</body>
</html>
